name: 'Basic Setup'
description: 'Basic setup with pnpm and cache restore'
runs:
  using: "composite"
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9.12.3
        run_install: false

    - name: Setup Node 22
      uses: actions/setup-node@v4
      with:
        node-version: "22.x"
        cache: "pnpm"

    - name: Add pnpm store path to env var
      id: pnpm-cache
      shell: bash
      run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

    - name: Restore pnpm store cache
      uses: actions/cache@v4
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    # SECURITY FIX: Install dependencies using a frozen lockfile to guarantee 
    # deterministic CI behavior and prevent supply chain drift.
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
