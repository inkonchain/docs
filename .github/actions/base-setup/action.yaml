name: 'Basic Setup'
description: 'Basic setup with pnpm and cache restore'
runs:
  using: "composite"
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        run_install: false

    # Pin to .nvmrc rather than "22.x": with the default check-latest=false,
    # setup-node will happily reuse an older 22.x preinstalled on the runner
    # image, so a floating range doesn't guarantee we get Node security patches.
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version-file: ".nvmrc"
        cache: "pnpm"

    - name: Add pnpm store path to env var
      id: pnpm-cache
      shell: bash
      run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

    - name: Restore Cache
      uses: actions/cache@v6
      with:
        path: |
          ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          **/node_modules
        key: ${{ runner.os }}-pnpm-store-v2-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-v2-

    # Always reconcile node_modules with the lockfile: a restore-keys fallback
    # can hand us modules from an older lockfile, which pnpm repairs quickly here.
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

