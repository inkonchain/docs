on:
  pull_request:
  push:
    branches:
      - main

jobs:
  securesdlc:
    uses: inkonchain/.github/.github/workflows/securesdlc.yml@main
    secrets: inherit

  js-lint:
    needs: securesdlc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/base-setup
        name: Base Setup
      - name: JS linting
        run: pnpm run lint:js

  md-lint:
    needs: securesdlc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/base-setup
        name: Base Setup
      - name: MDX linting
        run: pnpm run lint:mdx

  format:
    needs: securesdlc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/base-setup
        name: Base Setup
      # SECURITY/QUALITY FIX: Changed from mutating `format:js` to `format:js:check` 
      # so CI fails on drift instead of silently modifying the checkout.
      - name: Check formatting
        run: pnpm run format:js:check

  spell-check:
    needs: securesdlc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/base-setup
        name: Base Setup
      # QUALITY FIX: Re-enabled the active spell-check job to enforce documentation quality.
      - name: Run spell-check
        run: pnpm run spellcheck:lint

  build:
    needs: securesdlc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/base-setup
        name: Base Setup
      - name: Build application
        run: pnpm run build
      - name: Cache build
        uses: actions/cache/save@v4
        with:
          path: .next
          key: ${{ runner.os }}-build-store-${{ hashFiles('**/pnpm-lock.yaml') }}

  docker-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/inkonchain/docs:latest

      - name: Log out from GitHub Container Registry
        run: docker logout ghcr.io
