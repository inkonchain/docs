name: CI/CD Workflow
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  securesdlc:
    uses: inkonchain/.github/.github/workflows/securesdlc.yml@main
    secrets: inherit

  # Deliberately not `needs: securesdlc`. The SecureSDLC umbrella skips its
  # jobs when the actor is dependabot[bot], and a `needs` on a skipped job
  # skips everything downstream, so Dependabot PRs used to get no lint or
  # build at all while still showing as clean. SecureSDLC is enforced
  # independently by the branch ruleset's required workflow, so nothing
  # here needs to wait for it.
  install_modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: volta-cli/action@v5
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      # Pin to .nvmrc rather than "22.x": with the default check-latest=false,
      # setup-node will happily reuse an older 22.x preinstalled on the runner
      # image, so a floating range doesn't guarantee we get Node security patches.
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - name: Add pnpm store path to env var
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      # Restore the cache BEFORE installing: restoring afterwards can extract a
      # stale node_modules (via restore-keys) on top of a fresh install and then
      # save that poisoned state under the new lockfile's cache key.
      - name: Cache node modules
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.pnpm-cache.outputs.STORE_PATH }}
            **/node_modules
          key: ${{ runner.os }}-pnpm-store-v2-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-v2-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  js-lint:
    needs: install_modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/base-setup
        name: Base Setup
      - name: JS linting
        run: pnpm run lint:js

  md-lint:
    needs: install_modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/base-setup
        name: Base Setup
      - name: MDX linting
        run: pnpm run lint:mdx

  format:
    needs: install_modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/base-setup
        name: Base Setup
      - name: Run formatting
        run: pnpm run format:js

  # spell-check:
  #   needs: install_modules
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v7
  #     - uses: ./.github/actions/base-setup
  #       name: Base Setup
  #     - name: Run Spellcheck
  #       run: pnpm run spellcheck:lint

  build:
    needs: install_modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/base-setup
        name: Base Setup
      - name: Building app
        run: pnpm run build
      - name: Cache build
        uses: actions/cache/save@v6
        with:
          path: .next
          key: ${{ runner.os }}-build-store-${{ hashFiles('.next') }}

  # Deploys to the foundation-owned Vercel team using a token (no Vercel GitHub
  # App install needed on this org). Preview deploys only run for branches in
  # this repo, since fork PRs can't access secrets. Dependabot runs are
  # excluded too: they only see Dependabot secrets, not repository secrets,
  # so VERCEL_TOKEN would be empty and the deploy would fail.
  vercel-preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: team_EiiXT7xNqKi1zE7Mqbq4JYAO
      VERCEL_PROJECT_ID: prj_65DDk6laQQj9MHWKaPNBDxDxviDp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy preview to Vercel
        run: |
          URL=$(npx vercel@latest deploy --yes --token=${{ secrets.VERCEL_TOKEN }})
          echo "### Vercel preview" >> $GITHUB_STEP_SUMMARY
          echo "$URL" >> $GITHUB_STEP_SUMMARY

  vercel-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    # Serialize production deploys so rapid merges can't complete out of
    # order and briefly promote an older commit.
    concurrency:
      group: vercel-production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: team_EiiXT7xNqKi1zE7Mqbq4JYAO
      VERCEL_PROJECT_ID: prj_65DDk6laQQj9MHWKaPNBDxDxviDp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy to Vercel (production)
        run: npx vercel@latest deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
